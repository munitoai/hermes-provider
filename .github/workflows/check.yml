name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The plugin compiles, and models.json parses
        run: |
          python3 -m py_compile __init__.py
          python3 -c 'import json; json.load(open("models.json"))'
