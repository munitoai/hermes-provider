name: check

on:
  push:
    branches: [main]
  pull_request:
  # The API changes with no commit here, so the comparison also runs each day.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The plugin compiles, and models.json parses
        run: |
          python3 -m py_compile __init__.py
          python3 -c 'import json; json.load(open("models.json"))'
      - name: models.json agrees with the Munito AI API
        run: python3 .github/check_models.py
